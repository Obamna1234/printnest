[package]
name = "printnest-render"
description = "PrintNest print rasteriser: draws a page at print resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
printnest-model.workspace = true
printnest-layout.workspace = true
thiserror.workspace = true
# Already used by the GUI (egui) for text; reused so prints match the screen.
vello_cpu = { version = "=0.2.0", default-features = false, features = ["std", "u8_pipeline"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
epaint_default_fonts = "=0.37.0"

[dev-dependencies]
# Golden-image comparison in tests only.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true
