# PrintNest product catalogue.
#
# Every size here is a standard physical dimension, not copied from any
# company's software. `verified = false` until someone checks the preset
# against a real retailer and records where in the PR.
#
# Units: each `size` has a `unit` of "mm", "cm" or "in". Margins are always mm.
# Width is listed first; landscape and portrait are separate products.
#
# Export profiles:
#   kiosk_jpeg  one JPEG per page for photo kiosks and labs
#   print_pdf   PDF/X with bleed for print shops
#   home        home printer (system dialog or A4/Letter PDF)
#   template    DIY / merch template PDF or PNG

schema_version = 1

# ---------------------------------------------------------------- papers ---

[[paper]]
id = "plain-80"
name = "Plain paper 80 gsm"
gsm = 80
thickness_mm = 0.10

[[paper]]
id = "silk-170"
name = "Silk 170 gsm"
gsm = 170
thickness_mm = 0.16

[[paper]]
id = "matte-200"
name = "Matte photo 200 gsm"
gsm = 200
thickness_mm = 0.22

[[paper]]
id = "gloss-250"
name = "Gloss photo 250 gsm"
gsm = 250
thickness_mm = 0.25

[[paper]]
id = "lustre-260"
name = "Lustre photo 260 gsm"
gsm = 260
thickness_mm = 0.26

[[paper]]
id = "card-300"
name = "Card 300 gsm"
gsm = 300
thickness_mm = 0.35

[[paper]]
id = "canvas-380"
name = "Canvas 380 gsm"
gsm = 380
thickness_mm = 0.50

