# Build, lint and test on all three desktop platforms.
# Every third-party action is pinned to a full commit SHA (SPEC section 8).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --workspace --release --locked
      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          cli=target/release/printnest-cli
          $cli --version
          $cli catalogue > /dev/null
          $cli info book-20x20 --pages 40 > /dev/null
          tmp="$(mktemp -d)"
          $cli new book-20x20 --out "$tmp/p.json" --title "CI"
          $cli validate "$tmp/p.json"
          # Must refuse to overwrite.
          if $cli new print-6x4 --out "$tmp/p.json"; then
            echo "::error::CLI overwrote an existing file"; exit 1
          fi
          # Must reject a path-traversal project FOR THE RIGHT REASON: edit
          # the single page of a valid 6x4 print, so only the path is wrong.
          $cli new print-6x4 --out "$tmp/print.json"
          sed 's#"elements": \[\]#"elements": [{"type":"photo","id":"x","rect":{"x":0,"y":0,"w":10,"h":10},"src":"../../etc/passwd"}]#' \
            "$tmp/print.json" > "$tmp/evil.json"
          sed 's#"elements": \[\]#"elements": [{"type":"photo","id":"x","rect":{"x":0,"y":0,"w":10,"h":10},"src":"photos/ok.jpg"}]#' \
            "$tmp/print.json" > "$tmp/good.json"
          $cli validate "$tmp/good.json"   # control: same edit, safe path, accepted
          if $cli validate "$tmp/evil.json" 2> "$tmp/err.txt"; then
            echo "::error::CLI accepted a path-traversal project"; exit 1
          fi
          grep -q "'..' component" "$tmp/err.txt" \
            || { echo "::error::rejected, but not for the path:"; cat "$tmp/err.txt"; exit 1; }
          # Photos decode through the sandboxed worker, EXIF rotation applied.
          $cli photo tests/fixtures/rotated-64x48.jpg | grep -q "48 × 64 px .*decoded in a " \
            || { echo "::error::sandboxed photo decode failed"; exit 1; }
          printf 'GIF89a' > "$tmp/fake.jpg"
          if $cli photo "$tmp/fake.jpg"; then
            echo "::error::a non-image was accepted as a photo"; exit 1
          fi
          # Export end to end in every profile: new files only, valid output.
          mkdir "$tmp/Smoke.printnest" "$tmp/out"
          $cli new print-6x4 --out "$tmp/Smoke.printnest/project.json" --title "Smoke"
          for profile in kiosk shop home-a4 home-letter; do
            $cli export "$tmp/Smoke.printnest" --profile "$profile" --out "$tmp/out"
          done
          test -s "$tmp/out/Smoke - kiosk/Smoke.jpg"
          head -c 8 "$tmp/out/Smoke - print shop/Smoke - print shop.pdf" | grep -q '%PDF-1.4'
          test -s "$tmp/out/Smoke - home A4/Smoke - A4.pdf"
          test -s "$tmp/out/Smoke - home Letter/Smoke - Letter.pdf"
          # A second export must not touch the first.
          $cli export "$tmp/Smoke.printnest" --profile kiosk --out "$tmp/out"
          test -d "$tmp/out/Smoke - kiosk (2)"
          # With a real photo, decoded through the sandbox: same input must
          # give byte-identical files, with no camera metadata.
          mkdir -p "$tmp/Photo.printnest/photos" "$tmp/out2" "$tmp/out3"
          cp tests/fixtures/rotated-64x48.jpg "$tmp/Photo.printnest/photos/p.jpg"
          sed 's#"elements": \[\]#"elements": [{"type":"photo","id":"x","rect":{"x":-3,"y":-3,"w":158.4,"h":107.6,"rotation":0},"src":"photos/p.jpg"}]#' \
            "$tmp/print.json" > "$tmp/Photo.printnest/project.json"
          $cli validate "$tmp/Photo.printnest/project.json"
          for d in out2 out3; do
            $cli export "$tmp/Photo.printnest" --profile kiosk --out "$tmp/$d"
            $cli export "$tmp/Photo.printnest" --profile shop --out "$tmp/$d"
          done
          cmp "$tmp/out2/Untitled - kiosk/Untitled.jpg" "$tmp/out3/Untitled - kiosk/Untitled.jpg"
          cmp "$tmp/out2/Untitled - print shop/Untitled - print shop.pdf" \
              "$tmp/out3/Untitled - print shop/Untitled - print shop.pdf"
          if grep -q "Exif" "$tmp/out2/Untitled - kiosk/Untitled.jpg"; then
            echo "::error::exported JPEG contains EXIF metadata"; exit 1
          fi
          if find "$tmp" -name '*.partial' | grep -q .; then
            echo "::error::partial files left behind"; exit 1
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends qpdf >/dev/null
            qpdf --check "$tmp/out2/Untitled - print shop/Untitled - print shop.pdf"
            qpdf --check "$tmp/out/Smoke - home A4/Smoke - A4.pdf"
          fi

  msrv-lockfile:
    name: Lockfile is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Cargo.lock must not need changes
        run: cargo metadata --locked --format-version 1 > /dev/null
