[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/imaging",
    "crates/sandbox",
    "crates/layout",
    "crates/document",
    "apps/printnest-cli",
    "apps/printnest",
]
# Fuzz targets build with nightly + cargo-fuzz in their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Obamna1234/printnest"
authors = ["PrintNest contributors"]
publish = false

[workspace.dependencies]
printnest-model = { path = "crates/model" }
printnest-imaging = { path = "crates/imaging" }
printnest-sandbox = { path = "crates/sandbox" }
printnest-layout = { path = "crates/layout" }
printnest-document = { path = "crates/document" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
thiserror = "2"

# Security-relevant lints apply to every first-party crate.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
float_cmp = "warn"

[profile.release]
# Reproducible, hardened release builds.
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
overflow-checks = true
debug = false
incremental = false
